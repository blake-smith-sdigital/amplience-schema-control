name: Amplience Schema Updates

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - develop # TODO bs change to main
    paths:
      - 'amplience/schemas/**'

env:
  SCHEMA_DIR: 'amplience/schemas/'
  HUBS: |
    develop: Amplience B2C Development
    qa: Amplience B2C QA
    production: Amplience B2C Production


jobs:
  process-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Detect File Changes
        id: detect_changes
        run: |
          if [[ ${{ github.event_name }} == "pull_request" && ${{ github.event.pull_request.merged }} == "true" ]]; then
            FILES=$(curl -s -H "Authorization: Bearer ${{ secrets.API_ACCESS_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              | jq -r --arg folder "$SCHEMA_DIR" '.[] | select(.filename | startswith($folder)) | .filename')
          elif [[ ${{ github.event_name }} == "push" ]]; then
            FILES=$(git diff --name-only HEAD~1 -- "$SCHEMA_DIR")
          fi

          echo "$FILES" > changed_files.txt
          if [[ -n "$FILES" ]]; then
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          else
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Configure Amplience Hub
        id: configure_hub
        if: env.HAS_CHANGES == 'true'
        run: |
          case "${{ github.ref_name }}" in
            develop) hub="${{ env.HUBS.develop }}" ;;
            qa) hub="${{ env.HUBS.qa }}" ;;
            main) hub="${{ env.HUBS.production }}" ;;
            *) echo "No matching hub for branch"; exit 1 ;;
          esac

          echo "hub=$hub" >> $GITHUB_ENV
          echo "Current hub: ${{ env.hub }}"

      - name: Install Amplience CLI and Configure Hub
        if: env.HAS_CHANGES == 'true'
        env:
          client_id: ${{ env.client_id }}
          client_secret: ${{ env.client_secret }}
          hub_id: ${{ env.hub_id }}
          AMPLIENCE_CLIENT_ID_QA: ${{ vars.AMPLIENCE_CLIENT_ID_QA }}
          AMPLIENCE_CLIENT_ID_PRODUCTION: ${{ vars.AMPLIENCE_CLIENT_ID_PRODUCTION }}
          AMPLIENCE_CLIENT_ID_DEV2: ${{ vars.AMPLIENCE_CLIENT_ID_DEV2 }}

          AMPLIENCE_HUB_ID_QA: ${{ vars.AMPLIENCE_HUB_ID_QA }}
          AMPLIENCE_HUB_ID_PRODUCTION: ${{ vars.AMPLIENCE_HUB_ID_PRODUCTION }}
          AMPLIENCE_HUB_ID_DEV2: ${{ vars.AMPLIENCE_HUB_ID_DEV2 }}

          AMPLIENCE_SECRET_QA: ${{ secrets.AMPLIENCE_SECRET_QA }}
          AMPLIENCE_SECRET_PRODUCTION: ${{ secrets.AMPLIENCE_SECRET_PRODUCTION }}
          AMPLIENCE_SECRET_DEV2: ${{ secrets.AMPLIENCE_SECRET_DEV2 }}

        run: |
          npm install @amplience/dc-cli
          dc-cli configure --clientId $client_id --clientSecret $client_secret --hubId $hub_id

      - name: Upload Changed Schemas to Amplience
        if: env.HAS_CHANGES == 'true'
        run: |
          mkdir -p export/schemas
          while IFS= read -r file; do
            cp "$file" export/schemas/
          done < changed_files.txt

          dc-cli content-type-schema import export/schemas --publish

      - name: Upload Logs as Artifact
        if: env.HAS_CHANGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: amplience-logs
          path: /home/runner/.amplience/logs/*.log
